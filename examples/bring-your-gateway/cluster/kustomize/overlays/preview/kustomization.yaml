# Portable/manual installation. The operator owns the EnvoyExtensionPolicy and
# injects the trusted X-TSZ-Policy header as described in ENVOY_GATEWAY.md.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
patches:
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: tsz-ext-proc
        namespace: tsz-byg-demo
      spec:
        template:
          spec:
            containers:
              - name: tsz-ext-proc
                env:
                  - name: TSZ_POLICY_RESOLUTION_MODE
                    value: header
