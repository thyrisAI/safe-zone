{{- if and .Values.envoyGateway.enabled (eq .Values.envoyGateway.mode "native") .Values.envoyGateway.controller.enabled }}
{{- $name := include "thyris-sz.envoyGateway.controllerName" . -}}
{{- if .Values.envoyGateway.controller.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "thyris-sz.envoyGateway.controllerServiceAccountName" . }}
  labels:
    {{- include "thyris-sz.labels" . | nindent 4 }}
    app.kubernetes.io/component: envoy-controller
---
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "thyris-sz.labels" . | nindent 4 }}
    app.kubernetes.io/component: envoy-controller
spec:
  replicas: {{ .Values.envoyGateway.controller.replicaCount }}
  selector:
    matchLabels:
      {{- include "thyris-sz.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: envoy-controller
  template:
    metadata:
      labels:
        {{- include "thyris-sz.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: envoy-controller
    spec:
      serviceAccountName: {{ include "thyris-sz.envoyGateway.controllerServiceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.envoyGateway.migrations.enabled }}
      initContainers:
        - name: wait-for-policy-schema
          image: "{{ .Values.envoyGateway.migrations.image.repository }}:{{ .Values.envoyGateway.migrations.image.tag }}"
          imagePullPolicy: {{ .Values.envoyGateway.migrations.image.pullPolicy }}
          envFrom:
            - secretRef:
                name: {{ include "thyris-sz.secretName" . }}
          command: ["sh", "-ec"]
          args:
            - db_dsn="${DB_DSN%%&TimeZone=*}"; db_dsn="${db_dsn%%?TimeZone=*}"; until psql "$db_dsn" -tAc "SELECT to_regclass('public.guardrail_template_snapshots') IS NOT NULL" | grep -q t; do sleep 2; done
      {{- end }}
      containers:
        - name: tsz-controller
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/app/tsz-controller"]
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: metrics
              containerPort: 8080
              protocol: TCP
            - name: health
              containerPort: 8081
              protocol: TCP
          envFrom:
            - secretRef:
                name: {{ include "thyris-sz.secretName" . }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            {{- toYaml .Values.envoyGateway.controller.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}-metrics
  labels:
    {{- include "thyris-sz.labels" . | nindent 4 }}
    app.kubernetes.io/component: envoy-controller
spec:
  type: ClusterIP
  selector:
    {{- include "thyris-sz.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: envoy-controller
  ports:
    - name: metrics
      port: 8080
      targetPort: metrics
{{- end }}
