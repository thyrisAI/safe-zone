# Production topology: native controller and processor in tsz-system, with
# PostgreSQL and Redis in tsz-data. Set a released image tag or digest before
# applying this overlay; it intentionally never uses the local Kind image.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: tsz-system
resources:
  - ../native
patches:
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: tsz-ext-proc
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/env/0/value
        value: postgres://postgres:postgres@postgres.tsz-data.svc.cluster.local:5432/thyris?sslmode=disable&TimeZone=Europe/Istanbul
      - op: replace
        path: /spec/template/spec/containers/0/env/1/value
        value: redis://:thyrisredis@redis.tsz-data.svc.cluster.local:6379/0
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: tsz-controller
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/env/0/value
        value: postgres://postgres:postgres@postgres.tsz-data.svc.cluster.local:5432/thyris?sslmode=disable&TimeZone=Europe/Istanbul
      - op: replace
        path: /spec/template/spec/containers/0/env/1/value
        value: redis://:thyrisredis@redis.tsz-data.svc.cluster.local:6379/0
images:
  - name: thyris-sz
    newName: ghcr.io/thyrisai/thyris-sz
    newTag: REPLACE_WITH_RELEASE_TAG
