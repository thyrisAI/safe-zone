# Manual Phase 1–2 attachment for Envoy Gateway v1.8.3. This targets the
# mock-openai HTTPRoute from echo-demo.yaml; change targetRefs.name for a
# different route.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyExtensionPolicy
metadata:
  name: tsz-request-guardrail
  namespace: tsz-byg-demo
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: mock-openai
  extProc:
    - backendRefs:
        - group: ""
          kind: Service
          name: tsz-ext-proc
          port: 9002
      messageTimeout: 2s
      failOpen: false
      processingMode:
        request:
          body: Buffered
          # Envoy Gateway v1.8.3 exposes xds.route_* attributes to ext_proc.
          # Native controller-generated attachments use this trusted context;
          # the manual profile continues to resolve X-TSZ-Policy headers.
          attributes:
            - xds.route_name
      metadata:
        writableNamespaces:
          - io.thyris.tsz
