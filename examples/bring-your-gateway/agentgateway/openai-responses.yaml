# Phase 1 / item 2: buffered OpenAI Responses API through agentgateway.
# The referenced AgentgatewayBackend, tsz-ext-proc Service, and Deployment are
# installed separately. trusted-routing-context.yaml overwrites client identity
# before ExtProc runs.
# The TSZ deployment must set TSZ_GATEWAY_ADAPTER=agentgateway.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: responses-api
  namespace: ai-platform
spec:
  parentRefs:
    - name: agentgateway-proxy
  rules:
    - matches:
        - path:
            type: Exact
            value: /v1/responses
      backendRefs:
        - group: agentgateway.dev
          kind: AgentgatewayBackend
          name: openai
---
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: tsz-openai-responses
  namespace: ai-platform
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: responses-api
  traffic:
    extProc:
      conditional:
        - condition: 'request.path == "/v1/responses"'
          policy:
            backendRef:
              name: tsz-ext-proc
              port: 9002
            processingOptions:
              requestHeaderMode: Send
              responseHeaderMode: Send
              requestBodyMode: Buffered
              responseBodyMode: Buffered
              requestTrailerMode: Skip
              responseTrailerMode: Skip
              allowModeOverride: false
