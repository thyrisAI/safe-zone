# Phase 2 / item 3: buffered generic JSON HTTP APIs through agentgateway.
# The customer-api Service and tsz-ext-proc Service/Deployment are installed
# separately. trusted-routing-context.yaml supplies the policy identity and
# content-adapter selector before ExtProc runs.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: customer-api
  namespace: ai-platform
spec:
  parentRefs:
    - name: agentgateway-proxy
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api/customer-profiles
      backendRefs:
        - name: customer-api
          port: 8080
---
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: tsz-customer-api
  namespace: ai-platform
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: customer-api
  traffic:
    extProc:
      conditional:
        - condition: 'request.path.startsWith("/api/customer-profiles")'
          policy:
            backendRef:
              name: tsz-ext-proc
              port: 9002
            processingOptions:
              requestHeaderMode: Send
              responseHeaderMode: Send
              requestBodyMode: Buffered
              responseBodyMode: Buffered
              requestTrailerMode: Skip
              responseTrailerMode: Skip
              allowModeOverride: false
