apiVersion: apps/v1
kind: Deployment
metadata:
  name: byg-mock-siem
  namespace: tsz-byg-demo
spec:
  replicas: 1
  selector:
    matchLabels: {app: byg-mock-siem}
  template:
    metadata:
      labels: {app: byg-mock-siem}
    spec:
      containers:
        - name: sink
          image: thyris-sz:local
          imagePullPolicy: IfNotPresent
          command: ["/app/byg-mock-siem"]
          ports: [{containerPort: 8080}]
---
apiVersion: v1
kind: Service
metadata:
  name: byg-mock-siem
  namespace: tsz-byg-demo
spec:
  selector: {app: byg-mock-siem}
  ports: [{port: 8080, targetPort: 8080}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: tsz-ext-proc-allow-example-siem
  namespace: tsz-byg-demo
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: tsz-ext-proc}
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector: {matchLabels: {app: byg-mock-siem}}
      ports: [{protocol: TCP, port: 8080}]
