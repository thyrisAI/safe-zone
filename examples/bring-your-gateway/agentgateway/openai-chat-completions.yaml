# Phase 1 / item 1: buffered OpenAI Chat Completions through agentgateway.
# The referenced AgentgatewayBackend and tsz-ext-proc Deployment are installed
# separately. trusted-routing-context.yaml overwrites client-supplied identity
# before ExtProc runs.
# The TSZ deployment must set TSZ_GATEWAY_ADAPTER=agentgateway.
apiVersion: v1
kind: Service
metadata:
  name: tsz-ext-proc
  namespace: ai-platform
spec:
  selector:
    app.kubernetes.io/name: tsz-ext-proc
  ports:
    - name: grpc
      port: 9002
      targetPort: 9002
      protocol: TCP
      appProtocol: kubernetes.io/h2c
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: llm-api
  namespace: ai-platform
spec:
  parentRefs:
    - name: agentgateway-proxy
  rules:
    - matches:
        - path:
            type: Exact
            value: /v1/chat/completions
      backendRefs:
        - group: agentgateway.dev
          kind: AgentgatewayBackend
          name: openai
---
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: tsz-openai-chat-completions
  namespace: ai-platform
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: llm-api
  traffic:
    extProc:
      conditional:
        - condition: 'request.path == "/v1/chat/completions"'
          policy:
            backendRef:
              name: tsz-ext-proc
              port: 9002
            processingOptions:
              requestHeaderMode: Send
              responseHeaderMode: Send
              requestBodyMode: Buffered
              responseBodyMode: Buffered
              requestTrailerMode: Skip
              responseTrailerMode: Skip
              allowModeOverride: false
