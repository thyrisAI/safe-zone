name: TSZ CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  ci_scope:
    name: Detect CI scope
    runs-on: ubuntu-latest
    outputs:
      policy_api: ${{ steps.changes.outputs.policy_api }}
      byg_kind: ${{ steps.changes.outputs.byg_kind }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect changed areas
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "policy_api=true" >> "$GITHUB_OUTPUT"
            echo "byg_kind=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base="$PR_BASE_SHA"
            head="$PR_HEAD_SHA"
          else
            base="$PUSH_BEFORE_SHA"
            head="$CURRENT_SHA"
          fi

          if [[ -z "$base" || "$base" =~ ^0+$ ]]; then
            base="$(git rev-list --max-parents=0 "$head")"
          fi

          if git diff --quiet "$base" "$head" -- \
            api/v1alpha1 \
            api/v1beta1 \
            cmd/tsz-controller \
            config/crd \
            config/rbac \
            hack \
            internal/controller \
            internal/extproc/policy \
            .github/workflows/ci-test.yml \
            Makefile \
            go.mod \
            go.sum; then
            echo "policy_api=false" >> "$GITHUB_OUTPUT"
          else
            echo "policy_api=true" >> "$GITHUB_OUTPUT"
          fi

          if git diff --quiet "$base" "$head" -- \
            api/v1alpha1 \
            api/v1beta1 \
            cmd/byg-mock-openai \
            cmd/byg-mock-siem \
            cmd/tsz-controller \
            cmd/tsz-ext-proc \
            cmd/tsz-policy \
            config/crd \
            config/rbac \
            deployments/envoy-gateway \
            examples/bring-your-gateway \
            internal/config/extproc.go \
            internal/config/extproc_test.go \
            internal/controller \
            internal/extproc \
            internal/guardrails/audit.go \
            internal/guardrails/webhook_auditor.go \
            tests/integration/byg_replica_convergence_test.go \
            tests/integration/byg_replica_lifecycle_test.go \
            tests/perf \
            tests/release \
            .github/workflows/ci-test.yml \
            Dockerfile \
            Makefile \
            go.mod \
            go.sum; then
            echo "byg_kind=false" >> "$GITHUB_OUTPUT"
          else
            echo "byg_kind=true" >> "$GITHUB_OUTPUT"
          fi

  policy-api-compatibility:
    name: Policy API compatibility and storage upgrade
    needs: ci_scope
    if: needs.ci_scope.outputs.policy_api == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Verify generated API assets
        run: |
          make generate manifests
          git diff --exit-code -- api config/crd config/rbac

      - name: Test API schema and controller behavior
        run: go test ./api/... ./internal/controller/...

      - name: Test alpha-to-beta CRD upgrade with Kubernetes API server
        run: make test-envtest

  unit-tests:
    name: Unit tests (fast)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Cache Go build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            GOPATH/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Run unit tests
        run: go test ./tests/unit/...

  integration-tests:
    name: Integration tests (/detect, templates, gateway)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.14-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: thyris
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres" --health-interval=10s --health-timeout=5s --health-retries=5

      redis:
        image: redis:7.4.9-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping" --health-interval=10s --health-timeout=5s --health-retries=5

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Seed database with init.sql
        env:
          PGPASSWORD: postgres
        run: |
          psql \
            -h localhost \
            -U postgres \
            -d thyris \
            -f init.sql

      - name: Run TSZ server
        env:
          DB_DSN: postgres://postgres:postgres@localhost:5432/thyris?sslmode=disable&TimeZone=Europe/Istanbul
          REDIS_URL: redis://localhost:6379/0
          PII_MODE: MASK
          AUTH_ENABLED: "false"
          RATELIMIT_ENABLED: "true"
          RATELIMIT_REQUESTS_PER_SECOND: "1000"
          RATELIMIT_BURST: "1000"
        run: |
          go build -o tsz-gateway .
          ./tsz-gateway &
          echo "Waiting for server..." && sleep 15

      - name: Run integration tests
        env:
          TSZ_BASE_URL: http://localhost:8080
        run: go test ./tests/integration/...

      - name: Run policy migration and Redis integration tests
        env:
          TSZ_POLICY_TEST_DSN: postgres://postgres:postgres@localhost:5432/thyris?sslmode=disable
          TSZ_POLICY_TEST_REDIS_URL: redis://localhost:6379/0
        run: go test ./internal/extproc/policy/...

  integration-tests-auth:
    name: Integration tests (auth enabled)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.14-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: thyris
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres" --health-interval=10s --health-timeout=5s --health-retries=5

      redis:
        image: redis:7.4.9-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping" --health-interval=10s --health-timeout=5s --health-retries=5

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Seed database with init.sql
        env:
          PGPASSWORD: postgres
        run: |
          psql \
            -h localhost \
            -U postgres \
            -d thyris \
            -f init.sql

      - name: Run TSZ server (auth mode)
        env:
          DB_DSN: postgres://postgres:postgres@localhost:5432/thyris?sslmode=disable&TimeZone=Europe/Istanbul
          REDIS_URL: redis://localhost:6379/0
          PII_MODE: MASK
          AUTH_ENABLED: "true"
          AUTH_REQUIRE_BEARER_TOKEN: "true"
          AUTH_TOKEN_PERMISSIONS: "token_admin=*"
          AUTH_PUBLIC_PATHS: "/healthz,/ready"
          ADMIN_API_KEY: "test-admin-key"
          RATELIMIT_ENABLED: "true"
          RATELIMIT_REQUESTS_PER_SECOND: "1000"
          RATELIMIT_BURST: "1000"
        run: |
          go build -o tsz-gateway .
          ./tsz-gateway &
          echo "Waiting for server..." && sleep 15

      - name: Run integration tests (auth mode)
        env:
          TSZ_BASE_URL: http://localhost:8080
          TSZ_TEST_BEARER_TOKEN: token_admin
        run: go test ./tests/integration/...

  smoke-tests:
    name: Smoke / Sanity tests (e2e)
    runs-on: ubuntu-latest
    needs:
      - unit-tests
      - integration-tests
      - integration-tests-auth
    services:
      postgres:
        image: postgres:16.14-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: thyris
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres" --health-interval=10s --health-timeout=5s --health-retries=5

      redis:
        image: redis:7.4.9-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping" --health-interval=10s --health-timeout=5s --health-retries=5

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          # This job builds the root server first. The root module's Go version
          # also satisfies the CLI submodule's lower minimum version.
          go-version-file: go.mod

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Seed database with init.sql
        env:
          PGPASSWORD: postgres
        run: |
          psql \
            -h localhost \
            -U postgres \
            -d thyris \
            -f init.sql

      - name: Run TSZ server
        env:
          DB_DSN: postgres://postgres:postgres@localhost:5432/thyris?sslmode=disable&TimeZone=Europe/Istanbul
          REDIS_URL: redis://localhost:6379/0
          PII_MODE: MASK
          AUTH_ENABLED: "false"
          RATELIMIT_ENABLED: "true"
          RATELIMIT_REQUESTS_PER_SECOND: "1000"
          RATELIMIT_BURST: "1000"
        run: |
          go build -o tsz-gateway .
          ./tsz-gateway &
          echo "Waiting for server..." && sleep 20

      - name: Run smoke and streaming tests
        env:
          TSZ_BASE_URL: http://localhost:8080
        run: go test ./tests/e2e/...

  byg-example-smoke:
    name: BYG example smoke tests (Kind)
    runs-on: ubuntu-latest
    needs:
      - ci_scope
      - unit-tests
    if: needs.ci_scope.outputs.byg_kind == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Run BYG example smoke suite
        env:
          TSZ_BYG_CLUSTER_NAME: tsz-byg-ci
        run: examples/bring-your-gateway/smoke.sh

      - name: Set up k6
        uses: grafana/setup-k6-action@v1

      - name: Verify fail-closed processor outage through Envoy
        env:
          TSZ_BYG_CLUSTER_NAME: tsz-byg-ci
          TSZ_BYG_SKIP_BOOTSTRAP: "1"
        run: make perf-extproc-outage

      - name: Remove Kind cluster
        if: always()
        env:
          TSZ_BYG_CLUSTER_NAME: tsz-byg-ci
        run: deployments/envoy-gateway/kind-bootstrap.sh down

  documentation-link-checks:
    name: Documentation and adapter release checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Check adapter release documentation and examples
        run: go test ./tests/release

      - name: Check Markdown links
        uses: lycheeverse/lychee-action@v2
        with:
          args: --root-dir "$(pwd)" --verbose --no-progress --max-retries 3 --timeout 20 './**/*.md'
          token: ${{ secrets.GITHUB_TOKEN }}
