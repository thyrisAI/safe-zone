name: TSZ CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  unit-tests:
    name: Unit tests (fast)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Cache Go build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            GOPATH/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Run unit tests
        run: go test ./tests/unit/...

  integration-tests:
    name: Integration tests (/detect, templates, gateway)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: thyris
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres" --health-interval=10s --health-timeout=5s --health-retries=5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping" --health-interval=10s --health-timeout=5s --health-retries=5

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Seed database with init.sql
        env:
          PGPASSWORD: postgres
        run: |
          psql \
            -h localhost \
            -U postgres \
            -d thyris \
            -f init.sql

      - name: Run TSZ server
        env:
          DB_DSN: postgres://postgres:postgres@localhost:5432/thyris?sslmode=disable&TimeZone=Europe/Istanbul
          REDIS_URL: redis://localhost:6379/0
          PII_MODE: MASK
          AUTH_ENABLED: "false"
          RATELIMIT_ENABLED: "true"
          RATELIMIT_REQUESTS_PER_SECOND: "1000"
          RATELIMIT_BURST: "1000"
        run: |
          go build -o tsz-gateway .
          ./tsz-gateway &
          echo "Waiting for server..." && sleep 15

      - name: Run integration tests
        env:
          TSZ_BASE_URL: http://localhost:8080
        run: go test ./tests/integration/...

  integration-tests-auth:
    name: Integration tests (auth enabled)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: thyris
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres" --health-interval=10s --health-timeout=5s --health-retries=5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping" --health-interval=10s --health-timeout=5s --health-retries=5

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Seed database with init.sql
        env:
          PGPASSWORD: postgres
        run: |
          psql \
            -h localhost \
            -U postgres \
            -d thyris \
            -f init.sql

      - name: Run TSZ server (auth mode)
        env:
          DB_DSN: postgres://postgres:postgres@localhost:5432/thyris?sslmode=disable&TimeZone=Europe/Istanbul
          REDIS_URL: redis://localhost:6379/0
          PII_MODE: MASK
          AUTH_ENABLED: "true"
          AUTH_REQUIRE_BEARER_TOKEN: "true"
          AUTH_TOKEN_PERMISSIONS: "token_admin=*"
          AUTH_PUBLIC_PATHS: "/healthz,/ready"
          ADMIN_API_KEY: "test-admin-key"
          RATELIMIT_ENABLED: "true"
          RATELIMIT_REQUESTS_PER_SECOND: "1000"
          RATELIMIT_BURST: "1000"
        run: |
          go build -o tsz-gateway .
          ./tsz-gateway &
          echo "Waiting for server..." && sleep 15

      - name: Run integration tests (auth mode)
        env:
          TSZ_BASE_URL: http://localhost:8080
          TSZ_TEST_BEARER_TOKEN: token_admin
        run: go test ./tests/integration/...

  smoke-tests:
    name: Smoke / Sanity tests (e2e)
    runs-on: ubuntu-latest
    needs:
      - unit-tests
      - integration-tests
      - integration-tests-auth
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: thyris
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres" --health-interval=10s --health-timeout=5s --health-retries=5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping" --health-interval=10s --health-timeout=5s --health-retries=5

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: pkg/tsz-cli/go.mod

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Seed database with init.sql
        env:
          PGPASSWORD: postgres
        run: |
          psql \
            -h localhost \
            -U postgres \
            -d thyris \
            -f init.sql

      - name: Run TSZ server
        env:
          DB_DSN: postgres://postgres:postgres@localhost:5432/thyris?sslmode=disable&TimeZone=Europe/Istanbul
          REDIS_URL: redis://localhost:6379/0
          PII_MODE: MASK
          AUTH_ENABLED: "false"
          RATELIMIT_ENABLED: "true"
          RATELIMIT_REQUESTS_PER_SECOND: "1000"
          RATELIMIT_BURST: "1000"
        run: |
          go build -o tsz-gateway .
          ./tsz-gateway &
          echo "Waiting for server..." && sleep 20

      - name: Run smoke and streaming tests
        env:
          TSZ_BASE_URL: http://localhost:8080
        run: go test ./tests/e2e/...
